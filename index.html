/* Layout: sticky garage header (balance + minute income meter), tabs below, content grids of vehicle tiles.
   Single committed dark look: wet asphalt with road-paint amber. */

*{box-sizing:border-box}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.it{background:radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--rc) 30%,var(--panel)),var(--panel) 72%);border:1px solid color-mix(in srgb,var(--rc) 40%,var(--line));border-bottom:3px solid var(--rc);border-radius:8px;padding:18px 8px 10px;text-align:center;cursor:pointer;min-width:0;position:relative;overflow:hidden}
.it:hover{filter:brightness(1.18)}
.it .tg{position:absolute;top:4px;left:7px;font:700 9px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--rc)}
.it.sel{outline:2px solid var(--accent);background:var(--panel2)}

.case{background:linear-gradient(160deg,hsl(var(--h) 45% 24%),var(--panel) 70%);border:1px solid var(--line);border-radius:8px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.case:hover{border-color:hsl(var(--h) 70% 55%)}
.case .cb{width:100%;max-width:120px;height:66px;margin-bottom:4px}

.case .p{font:700 15px var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.case small{color:var(--mute)}
.case.lock{opacity:.5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.roll{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:8px;height:150px;margin:12px 0}
.roll::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--accent);box-shadow:0 0 14px 2px var(--accent);z-index:2}
.roll::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,var(--bg),transparent 16%,transparent 84%,var(--bg))}
.roll{background:var(--bg);border-color:var(--accent)}
@keyframes pop{0%{transform:scale(.4) rotate(-6deg);opacity:0}60%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px 0 var(--rc)}50%{box-shadow:0 0 28px 6px var(--rc)}}

.strip{display:flex;gap:8px;padding:10px 0 10px 0;will-change:transform}

.pair{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.pair .it{width:128px;cursor:default}
.arrow{font:700 22px var(--f-display);color:var(--mute)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick .btn{padding:5px 10px}
.odds{max-height:260px;overflow-y:auto}
.odds div{display:flex;justify-content:space-between;gap:10px;padding:4px 2px;border-bottom:1px solid var(--line);font-size:13px}
.odds span:first-child{min-width:0;overflow-wrap:anywhere}
.odds .n{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
#buybar{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:10px 14px}

.catpad{height:90px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fly{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 16px;border-radius:8px;font-weight:800;z-index:30;max-width:calc(100% - 32px);text-align:center}

body{background:radial-gradient(900px 500px at 85% -10%,#2b2510,transparent 60%),radial-gradient(700px 500px at -10% 10%,#102233,transparent 60%),var(--bg);background-attachment:fixed}
header{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px)}
.brand{background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border-radius:10px;transition:transform .12s,border-color .12s,filter .12s}.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,#ffd45f,var(--accent));box-shadow:0 4px 16px #ffbf2e33}

.cases{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}

.case::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(135deg,hsl(var(--h) 70% 55%/.3) 0 8px,transparent 8px 16px);pointer-events:none}
.case .cb{max-width:130px;height:72px;filter:drop-shadow(0 8px 10px #000a)}

#drive{position:fixed;inset:0;z-index:100;background:#000}#drive canvas{width:100%;height:100%;display:block}

@keyframes cfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  const pool=th?themePool(th,P):ITEMS.filter(it=>it.v>=P*.2&&it.v<=P*40);
  const lowI=pool.filter(it=>it.v<P),highI=pool.filter(it=>it.v>=P);
  const mean=(arr,p)=>{let s=0,w=0;for(const it of arr){const x=Math.pow(it.v/P,-p);s+=x*it.v;w+=x}return s/w};
  const Elow=lowI.length?mean(lowI,0):0;
  let lo=0,hi=12;
  if(mean(highI,0)>P*1.8){for(let k=0;k<50;k++){const m=(lo+hi)/2;if(mean(highI,m)>P*1.8)lo=m;else hi=m}}else{lo=hi=0}
  const ph=(lo+hi)/2,Ehigh=mean(highI,ph);
  let q=lowI.length?(P*.97-Elow)/(Ehigh-Elow):1;
  q=lowI.length?Math.max(.3,Math.min(.5,q)):1;
  let sh=0;highI.forEach(it=>sh+=Math.pow(it.v/P,-ph));
  const w=pool.map(it=>it.v<P?(1-q)/lowI.length:q*Math.pow(it.v/P,-ph)/sh);
  const cum=[];let a=0;w.forEach(x=>{a+=x;cum.push(a)});cum[cum.length-1]=1;
  return {i,name:c[0],ico:c[1],art:artFor(pool.reduce((b,it)=>Math.abs(it.v-P*1.3)<Math.abs(b.v-P*1.3)?it:b)),price:P,th:!!th,h:(i*41+200)%360,pool,w,cum,rtp:pool.reduce((s,it,k)=>s+w[k]*it.v,0)/P,profit:q};
});
function pick(c){const r=Math.random();let lo=0,hi=c.cum.length-1;while(lo<hi){const m=(lo+hi)>>1;if(c.cum[m]<r)lo=m+1;else hi=m}return c.pool[lo]}

function tone(f,t0,d,type,vol,f2){
  if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
const SND={

  click:()=>tone(520,0,.06,"triangle",.1),

  lose:()=>{tone(330,0,.18,"sawtooth",.07,200);tone(220,.18,.35,"sawtooth",.07,90)},
  win:t=>{const n=[523,659,784,988,1175,1568,2093];for(let i=0;i<Math.min(7,t+3);i++)tone(n[i],i*.09,.28,"triangle",.1);if(t>=4)tone(130,0,.9,"sawtooth",.06,260)}
};
function tickLoop(strip,dur){
  let last=-1;const t0=performance.now();
  (function f(){
    let x=0;try{x=new DOMMatrixReadOnly(getComputedStyle(strip).transform).m41}catch(e){}
    const idx=Math.floor((-x+strip.parentElement.clientWidth/2)/116);
    if(idx!==last){last=idx;SND.tick()}
    if(performance.now()-t0<dur+300&&document.body.contains(strip))requestAnimationFrame(f);
  })();
}

function bizInit(){S.biz=S.biz||{};S.infra=S.infra||{};S.coll=S.coll||{};S.colDone=S.colDone||{};S.bizT=S.bizT||Date.now();S.bizTot=S.bizTot||0}

const inf=k=>(S.infra&&S.infra[k])||0;

function carRate(d,c){const it=ITEMS[c.id];if(c.cond<=0)return 0;return d.k*Math.pow(it.v,.78)*d.bon(it)*(.7+.3*c.cond/100)}
function bizCalc(d,st){
  const n=st.cars.length,cs=st.cars;let raw=0,avg=0,br=0;
  cs.forEach(c=>{raw+=carRate(d,c);avg+=c.cond;if(c.cond<=0)br++});avg=n?avg/n:0;
  const R=n?Math.max(1,Math.min(5,2+lvl(st,"staff")*.12+avg/100*1.6-br/n*1.5+(Date.now()<st.ads?.3:0))):0;
  const now=Date.now(),mod=(st.mod&&now<st.mod.until)?st.mod.m:1,ad=now<(st.ads||0)?2:1;
  const mult=(1+.08*lvl(st,"app"))*(1+.04*lvl(st,"staff"))*CITIES[st.city||0][1]*(1+.02*inf("dispatch"))*colMult()*(.7+.1*R)*mod*ad*v2mult(st);
  const gross=raw*mult,opex=Math.max(.06,Math.min(.6,d.opex*(1-.02*lvl(st,"fuel"))*(1-.015*inf("gas"))*v2opex()));
  return {gross,net:gross*(1-opex),opex,R,avg,br,mult,cap:Math.max(1,(2+lvl(st,"vault")+.25*inf("bank")+techEff("vault")))*3600}
}
function bizTick(){
  bizInit();const now=Date.now();let dt=Math.max(0,Math.min(28800,(now-S.bizT)/1000));S.bizT=now;if(dt<=0)return;
  let off=0;
  BIZ.forEach(d=>{const st=S.biz[d.id];if(!st||!st.own)return;
    const ca=bizCalc(d,st),wr=100/3000*(1-.05*lvl(st,"mech"))*(1-.03*inf("service"))*(1-techEff("wear"));
    let earn=0;
    st.cars.forEach(c=>{const r=carRate(d,c);if(c.cond>0){const up=Math.min(dt,c.cond/wr);earn+=r*up*(1-ca.opex)*ca.mult*.97;c.cond=Math.max(0,c.cond-wr*dt)}
      if((lvl(st,"mech")>=8||inf("service")>=10)&&c.cond<15){const cost=(100-c.cond)/100*ITEMS[c.id].v*.05;if(S.bal>=cost){S.bal-=cost;c.cond=100}}});
    st.ern=(st.ern||0)+earn;const capv=ca.net*ca.cap||0;st.cash=Math.min((st.cash||0)+earn,Math.max(capv,0)||0);
    if(inf("bank")>0&&st.cash>=capv*.5&&st.cash>0){S.bal+=st.cash;S.bizTot+=st.cash;off+=st.cash;st.cash=0}
    if(dt>5)off+=0;
    if(!st.nev)st.nev=now+30000+Math.random()*60000;
    if(now>st.nev&&dt<10&&st.cars.length){st.nev=now+45000+Math.random()*75000;bizEvent(d,st,ca)}
    if(st.choice&&now>st.choice.exp){st.choice=null;bizLog(st,"⌛","Решение не принято — момент упущен.");if(bizOpen===d.id)viewBiz()}
  });
  try{v2Tick(dt)}catch(e){console.error(e)}
  if(dt>20&&off>0)toast("Бухгалтерия собрала: "+fmt(off));
  if(tab==="biz")bizLive();
}

function bizEvent(d,st,ca){SND.alert();

  if(nc&&!st.choice){const k=Math.random()*CHS.length|0;st.choice={k,exp:Date.now()+30000};bizLog(st,CHS[k].ico,CHS[k].t+" — нужно решение!");SND.coin();toast(CHS[k].ico+" "+d.name+": "+CHS[k].t);if(tab==="biz")viewBiz();return}
  let tw=0;EVS.forEach(e=>tw+=e.w);let r=Math.random()*tw,ev=EVS[0];for(const e of EVS){r-=e.w;if(r<=0){ev=e;break}}
  const ins=1-.04*inf("insure");let x=ev.x;

  else if(ev.fx==="crash"){const c=st.cars[Math.random()*st.cars.length|0];c.cond=Math.max(0,c.cond-35*ins);const f=g*40*ins;S.bal=Math.max(0,S.bal-f);x="Машина "+ITEMS[c.id].model+" повреждена, штраф "+fmt(f);SND.lose()}
  else if(ev.fx==="fine"){const f=g*30*ins;S.bal=Math.max(0,S.bal-f);x="Штраф "+fmt(f)}
  else if(ev.fx==="tip"){const t=g*45;st.cash=(st.cash||0)+t;x="+"+fmt(t)+" чаевых в кассу";SND.coin()}
  bizLog(st,ev.ico,ev.t+": "+x);toast(ev.ico+" "+d.name+": "+ev.t);if(tab==="biz")viewBiz();
}
function bizChoose(id,i){
  const d=bizOf(id),st=S.biz[id];if(!st||!st.choice)return;const ch=CHS[st.choice.k],ca=bizCalc(d,st);
  const o=ch.r[i]({g:ca.net});st.choice=null;let msg=o.t||ch.a[i];
  if(o.cost){S.bal=Math.max(0,S.bal-o.cost*(1-.04*inf("insure")*0))}

  if(o.wear&&st.cars.length){const c=st.cars[Math.random()*st.cars.length|0];c.cond=Math.max(0,c.cond-o.wear)}
  if(o.mod)st.mod={m:o.mod[0],until:Date.now()+o.mod[1]*1000,ico:ch.ico,t:ch.t};
  bizLog(st,ch.ico,msg);toast(ch.ico+" "+msg);save();head();viewBiz();
}

function restoreFocus(id,pos){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");
  if(t){if(busy)return;tab=t.dataset.tab;if(tab!=='upg')addM=0;openCase=null;q="";rf="all";catSel=null;catLimit=120;render();return}

  const sl=e.target.closest("[data-sell]");
  if(e.target.id==="snd"){muted=!muted;try{localStorage.setItem("vd-mute",muted?"1":"0")}catch(_){}$("#snd").textContent=muted?"Звук: выкл":"Звук: вкл";SND.click();return}
  if(e.target.id==="revClose"||e.target.id==="reveal"){$("#reveal").hidden=true;return}
  if(sl){sell(sl.dataset.sell.split(",").map(Number));sl.disabled=true;sl.textContent="Продано";if(sl.id==="revSell")$("#reveal").hidden=true;return}

  if(qb&&!busy){qty=+qb.dataset.qty;document.querySelectorAll("#qty .btn").forEach(b=>b.classList.toggle("pri",+b.dataset.qty===qty));const c=CASES[openCase],ob=$("#openBtn");ob.textContent=openLabel(c);ob.disabled=S.bal<c.price*qty;return}

  if(e.target.id==="selJunk"){invItems().filter(i=>i.t===0).forEach(i=>sel.add(i.uid));viewInv();return}
  if(e.target.id==="selNone"){sel.clear();viewInv();return}
